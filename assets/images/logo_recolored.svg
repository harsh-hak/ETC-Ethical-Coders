<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192338" />
      <stop offset="100%" stop-color="#121B2B" />
    </linearGradient>
    <linearGradient id="logo-emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9E1F1" />
      <stop offset="50%" stop-color="#8FB3E2" />
      <stop offset="100%" stop-color="#31487A" />
    </linearGradient>
    <linearGradient id="logo-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FB3E2" />
      <stop offset="50%" stop-color="#31487A" />
      <stop offset="100%" stop-color="#8FB3E2" />
    </linearGradient>
    <filter id="brutalist-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#8FB3E2" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#logo-bg-grad)" />

  <!-- Outer Rounded Geometric Frame -->
  <rect x="50" y="50" width="400" height="400" rx="80" fill="#1E2E4F" stroke="url(#logo-border-grad)" stroke-width="8" filter="url(#brutalist-glow)" />

  <!-- Geometric ETC Emblem in Palette Colors -->
  <g transform="translate(0, 5)">
    <!-- Top Bar of T / E -->
    <path d="M 170 160 L 335 160 L 310 190 L 195 190 Z" fill="url(#logo-emblem-grad)" />
    
    <!-- Central T and Dynamic Diagonal Spine -->
    <path d="M 235 190 L 275 190 L 215 325 L 180 325 Z" fill="url(#logo-emblem-grad)" />
    
    <!-- Left 'E' Bracket Section -->
    <path d="M 125 210 L 195 210 L 175 240 L 145 240 L 170 270 L 125 270 Z" fill="url(#logo-emblem-grad)" />
    <path d="M 125 270 L 180 270 L 195 300 L 140 300 L 220 335 L 205 345 L 125 300 Z" fill="url(#logo-emblem-grad)" />
    
    <!-- Right 'C' Section -->
    <path d="M 330 210 L 375 210 L 350 240 L 320 240 L 305 270 L 375 270 L 355 300 L 285 300 L 305 240 L 315 210 Z" fill="url(#logo-emblem-grad)" />

    <!-- Sharp Center Accent Spear -->
    <polygon points="215,310 230,345 205,320" fill="#D9E1F1" />
  </g>
</svg>
